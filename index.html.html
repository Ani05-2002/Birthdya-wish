<!DOCTYPE html>
<html>
<head>
<title>Happy Birthday</title>

<style>

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
font-family:Arial;
background:linear-gradient(135deg,#667eea,#764ba2);
color:white;
text-align:center;
overflow:hidden;
}

h1{
font-size:70px;
animation: glow 2s infinite alternate;
}

h2{
font-size:40px;
}

@keyframes glow{
from{text-shadow:0 0 10px #fff;}
to{text-shadow:0 0 30px #ffeb3b;}
}

/* Cake */

.cake{
position:relative;
width:200px;
height:120px;
background:#ff8fab;
border-radius:10px;
margin-top:20px;
}

.candle{
position:absolute;
width:10px;
height:40px;
background:white;
top:-40px;
left:95px;
}

.flame{
position:absolute;
width:15px;
height:20px;
background:orange;
border-radius:50%;
top:-20px;
left:-2px;
animation:flicker 0.3s infinite alternate;
}

@keyframes flicker{
from{transform:scale(1);}
to{transform:scale(1.2);}
}

/* Confetti */

.confetti{
position:absolute;
width:10px;
height:10px;
background:red;
top:-10px;
animation:fall 5s linear infinite;
}

@keyframes fall{
to{
transform:translateY(100vh) rotate(720deg);
}
}

</style>

</head>

<body>

<h1>🎉 Happy Birthday 🎉</h1>
<h2 id="name">Shruti</h2>

<div class="cake">
<div class="candle">
<div class="flame"></div>
</div>
</div>

<script>

const params = new URLSearchParams(window.location.search);
const name = params.get("name") || "My Friend";
document.getElementById("name").innerText = name;

// Confetti generator
for(let i=0;i<50;i++){
let conf=document.createElement("div");
conf.className="confetti";
conf.style.left=Math.random()*100+"vw";
conf.style.backgroundColor=`hsl(${Math.random()*360},100%,50%)`;
conf.style.animationDuration=(Math.random()*3+2)+"s";
document.body.appendChild(conf);
}

</script>

</body>
</html>
